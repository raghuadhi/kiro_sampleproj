<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Drive — 3D Racing</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Loading screen -->
  <div id="loading" class="screen">
    <div class="loader-box">
      <div class="logo">APEX&nbsp;DRIVE</div>
      <div class="spinner"></div>
      <div class="loading-text">Loading engine...</div>
    </div>
  </div>

  <!-- Main Menu -->
  <div id="main-menu" class="screen hidden">
    <div class="menu-panel">
      <h1 class="title">APEX DRIVE</h1>
      <p class="subtitle">3D Arcade Racing</p>
      <div class="menu-buttons">
        <button id="btn-play" class="btn btn-primary">Continue / Play</button>
        <button id="btn-levels" class="btn">Level Select</button>
        <button id="btn-reset" class="btn btn-danger">Reset Progress</button>
      </div>
      <div class="credits">Arrow keys / WASD to drive · Space to brake · R to reset car</div>
    </div>
  </div>

  <!-- Level Select -->
  <div id="level-select" class="screen hidden">
    <div class="menu-panel">
      <h2 class="title-sm">Select Level</h2>
      <div id="level-grid" class="level-grid"></div>
      <button id="btn-levels-back" class="btn">Back</button>
    </div>
  </div>

  <!-- Pause Menu -->
  <div id="pause-menu" class="screen hidden overlay">
    <div class="menu-panel">
      <h2 class="title-sm">Paused</h2>
      <div class="menu-buttons">
        <button id="btn-resume" class="btn btn-primary">Resume</button>
        <button id="btn-restart" class="btn">Restart Level</button>
        <button id="btn-quit" class="btn btn-danger">Quit to Menu</button>
      </div>
    </div>
  </div>

  <!-- Level Complete -->
  <div id="level-complete" class="screen hidden overlay">
    <div class="menu-panel">
      <h2 class="title-sm">Level Complete!</h2>
      <div id="complete-stats" class="stats"></div>
      <div class="menu-buttons">
        <button id="btn-next" class="btn btn-primary">Next Level</button>
        <button id="btn-replay" class="btn">Replay</button>
        <button id="btn-complete-menu" class="btn">Menu</button>
      </div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top-left">
      <div id="lap-counter" class="hud-chip">Lap 1/3</div>
      <div id="level-name" class="hud-chip">Level</div>
    </div>
    <div class="hud-top-right">
      <div id="timer" class="hud-chip">00:00.00</div>
      <div id="best-time" class="hud-chip small">Best: --:--.--</div>
    </div>
    <div class="hud-bottom-right">
      <div id="speedo">
        <span id="speed-value">0</span>
        <span class="speed-unit">km/h</span>
      </div>
    </div>
    <div id="countdown" class="countdown hidden">3</div>
    <div id="wrong-way" class="wrong-way hidden">WRONG WAY</div>
  </div>

  <canvas id="game-canvas"></canvas>

  <!-- Three.js + modules via import map (no build step) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
